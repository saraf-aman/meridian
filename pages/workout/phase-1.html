<script>
var PHASE_CONFIG = {
  num: 1,
  title: 'Foundation Building',
  subtitle: 'Phase 1 · Weeks 1–4',
  tagline: '3 gym sessions + 2 cardio per week',
  goal: 'Build movement patterns, connective tissue, and the training habit using back-safe machine and dumbbell work.',
  sessions: {
    mon: {
      label: 'Mon', sub: 'Upper Body', type: 'gym',
      title: 'Monday — Upper Body',
      desc: 'Foundational pushing and pulling strength. Chest, back, shoulders, and arms.',
      duration: '~55 mins',
      exercises: [
        { id: 'db_bench',         sets: 3, reps: '10',          tempo: '3-1-2-0', rest: 90, weight: '20–25 lbs/hand' },
        { id: 'cable_row',        sets: 3, reps: '10',          tempo: '3-1-2-1', rest: 90, weight: '25–35 lbs' },
        { id: 'shoulder_press',   sets: 3, reps: '10',          tempo: '3-1-2-0', rest: 90, weight: '10–12 lbs/hand' },
        { id: 'lat_pulldown',     sets: 3, reps: '12',          tempo: '3-1-2-0', rest: 90, weight: '35–45 lbs' },
        { id: 'bicep_curl',       sets: 2, reps: '12',          tempo: '3-0-2-1', rest: 60, weight: '10–12 lbs/hand' },
        { id: 'tricep_pushdown',  sets: 2, reps: '12',          tempo: '3-0-2-1', rest: 60, weight: '12–18 lbs' },
        { id: 'dead_bug',         sets: 3, reps: '8 each side', tempo: 'Slow',    rest: 60, weight: 'Bodyweight' }
      ]
    },
    tue: {
      label: 'Tue', sub: 'Cardio', type: 'cardio',
      title: 'Tuesday — Cardio',
      desc: 'Goal: build your aerobic base. These sessions are not about speed — they are about training your heart, lungs, and legs to sustain effort over time. Do the Cardio warm-up before starting.',
      duration: '25–32 mins',
      cardio: [
        {
          title: 'Weeks 1–2 — Brisk Walk',
          desc: 'A continuous brisk walk for 25–30 minutes. "Brisk" means purposeful and slightly effortful — not a gentle stroll, but not gasping either.',
          details: [
            'Treadmill: set speed to 3.1–3.7 mph. Start at the lower end in Week 1 and inch it up as the weeks go on. Adjust based on how you feel — the speed is a guideline, not a rule.',
            'Outdoors: walk as if you are slightly late for something. Arms swinging, stride purposeful.',
            'The talk test — how to know if your pace is right: you should be able to speak in complete sentences, but you would not want to hold a long conversation. If you can chat easily with zero effort, go faster. If you cannot string a sentence together, slow down.',
            'What you will feel: a noticeable increase in breathing, mild warmth in your legs, and a light sweat by the end. This is exactly right.',
            'If 25 minutes feels very easy by the end of Week 2, that is a good sign — your fitness is already improving. The interval protocol in Weeks 3–4 will challenge you again.'
          ]
        },
        {
          title: 'Weeks 3–4 — Interval Walk',
          desc: 'Total duration: 28–32 minutes. Same overall time as Weeks 1–2, but now you alternate between a fast push and an easy recovery. This trains your cardiovascular system more efficiently than a steady pace.',
          details: [
            'Fast walk (work interval): 3.7–4.3 mph on the treadmill, or outdoors at a pace where you are quite breathless — you can only manage a few words, not a full sentence. This should feel hard but survivable.',
            'Easy walk (recovery interval): drop back to 2.8–3.1 mph. Use this time to recover your breathing — you should feel mostly recovered before the next fast interval begins.',

          intervals: [
            { label: '5 min warm-up walk', type: 'rest' },
            { label: '1 min fast walk', type: 'work' },
            { label: '2 min easy walk', type: 'rest' },
            { label: '× 6 rounds', type: 'work' },
            { label: '5 min cool-down walk', type: 'rest' }
          ],
          note: 'Total active interval time: 6 × 3 min = 18 min + 10 min warm-up/cool-down = 28 min. If a round feels too hard to complete, slow the fast interval slightly rather than stopping — keep moving.'
        }
      ]
    },
    wed: {
      label: 'Wed', sub: 'Lower Body', type: 'gym',
      title: 'Wednesday — Lower Body',
      desc: 'Foundational leg, glute, and hamstring strength. Core stability work. No barbell this phase.',
      duration: '~55 mins',
      exercises: [
        { id: 'leg_press',     sets: 3, reps: '12',          tempo: '3-1-2-0', rest: 90, weight: '65–90 lbs' },
        { id: 'goblet_squat',  sets: 3, reps: '10',          tempo: '3-1-2-0', rest: 90, weight: '15–20 lbs' },
        { id: 'leg_curl',      sets: 3, reps: '12',          tempo: '3-1-2-1', rest: 90, weight: '25–35 lbs' },
        { id: 'leg_extension', sets: 3, reps: '12',          tempo: '3-0-2-1', rest: 60, weight: '25–35 lbs' },
        { id: 'calf_raise',    sets: 3, reps: '15',          tempo: '2-1-2-1', rest: 60, weight: '35–45 lbs' },
        { id: 'glute_bridge',  sets: 3, reps: '15',          tempo: '2-1-2-1', rest: 60, weight: 'Bodyweight' },
        { id: 'bird_dog',      sets: 3, reps: '8 each side', tempo: 'Slow',    rest: 60, weight: 'Bodyweight' }
      ]
    },
    thu: {
      label: 'Thu', sub: 'Rest', type: 'rest',
      title: 'Thursday — Rest',
      desc: 'Full rest day. Muscles grow during recovery, not during training.'
    },
    fri: {
      label: 'Fri', sub: 'Full Body', type: 'gym',
      title: 'Friday — Full Body',
      desc: 'Lighter compound session working the whole body. Reinforces movement patterns and bridges the week.',
      duration: '~55 mins',
      exercises: [
        { id: 'goblet_squat',      sets: 3, reps: '10',         tempo: '3-1-2-0', rest: 90, weight: '15–20 lbs' },
        { id: 'romanian_dl',       sets: 3, reps: '10',         tempo: '3-1-2-0', rest: 90, weight: '15–20 lbs/hand' },
        { id: 'push_ups',          sets: 3, reps: 'Max (8–15)', tempo: '3-0-2-0', rest: 90, weight: 'Bodyweight' },
        { id: 'cable_row',         sets: 3, reps: '10',          tempo: '3-1-2-1', rest: 90, weight: '25–35 lbs' },
        { id: 'plank',             sets: 3, reps: '20–30 sec',  tempo: 'N/A',     rest: 60, weight: 'Bodyweight' },
        { id: 'mountain_climbers', sets: 2, reps: '20 total',   tempo: 'Controlled', rest: 60, weight: 'Bodyweight' }
      ]
    },
    sat: {
      label: 'Sat', sub: 'Cardio', type: 'cardio',
      title: 'Saturday — Cardio (Morning)',
      desc: 'Same walk protocol as Tuesday, but it is morning — your body is in a different state and needs to be treated differently. Use the full Morning Warm-Up before starting.',
      duration: '25–32 mins',
      cardio: [
        {
          title: 'Morning vs. Evening — What Is Different',
          details: [
            'Your spine is slightly compressed after lying down all night. Your muscles are cold. Your joints are stiffer. All of this is normal, but it means you need more time to ease in before pushing.',

            'You may feel sluggish for the first 5–10 minutes. This is normal and will pass. Do not judge your fitness by how you feel in the first few minutes of a morning session.',
            'Drink a glass of water before you leave. Your body has been without water for 7–8 hours.'
          ]
        },
        {
          title: 'Weeks 1–2 — Brisk Walk (Morning)',
          desc: 'Same target as Tuesday, but eased into more gradually.',
          details: [
            'Minutes 1–5: slow walk at 2.5–2.8 mph. This is mandatory. Do not jump straight to the brisk pace.',
            'Minutes 5–25: increase to your brisk walking pace (3.1–3.7 mph on treadmill, or the "slightly late" outdoor pace).',
            'Talk test still applies: able to speak in full sentences, slightly breathless, would not want to hold a long conversation.',
            'Total session: 25–30 minutes including the slow opening.'
          ]
        },
        {
          title: 'Weeks 3–4 — Interval Walk (Morning)',
          desc: 'Same interval structure as Tuesday. The warm-up walk within the session replaces the slow opening — do not double up.',
          details: [
            'The 5-minute easy warm-up walk at the start of the interval protocol (2.8–3.1 mph) serves as your gradual ramp-up. This is especially important in the morning.',
            'The fast walk intervals (3.7–4.3 mph) may feel harder in the morning than the same effort on Tuesday evening — this is normal. Adjust the speed slightly down if needed rather than stopping.',
            'The 5-minute cool-down walk at the end counts toward total session time.'
          ],
          intervals: [
            { label: '5 min warm-up walk', type: 'rest' },
            { label: '1 min fast walk', type: 'work' },
            { label: '2 min easy walk', type: 'rest' },
            { label: '× 6 rounds', type: 'work' },
            { label: '5 min cool-down walk', type: 'rest' }
          ],
          note: 'If Saturday morning feels significantly harder than Tuesday evening at the same pace — that is expected. Your body performs differently first thing in the morning. Slow down rather than stop.'
        }
      ]
    },
    sun: {
      label: 'Sun', sub: 'Rest', type: 'rest',
      title: 'Sunday — Rest',
      desc: 'Full rest day.'
    }
  },
  checklist: {
    phase: 1,
    title: 'Phase 1 → Phase 2 Transition Checklist',
    desc: 'Do not move to Phase 2 based on calendar time alone. Move when every item on this list is checked. This may happen at Week 4 or take until Week 6 — both are normal.',
    groups: [
      {
        label: 'Strength',
        items: [
          'DB flat bench press: all 3 × 10 at 25 lbs each hand with correct tempo',
          'Goblet squat: all 3 × 10 at 22 lbs with correct tempo',
          'Seated cable row: all 3 × 10 at 35 lbs with correct tempo',
          'Push-ups: 3 sets of at least 8 full push-ups (not knee push-ups) with correct form'
        ]
      },
      {
        label: 'Form',
        items: [
          'Romanian deadlift: spine stays neutral for all 10 reps without any conscious reminder',
          'Goblet squat: heels stay flat throughout and knees track over toes',
          'Seated cable row: torso stays upright, no rounding at full arm extension',
          'Dumbbell shoulder press: no back arch at any point during the set'
        ]
      },
      {
        label: 'Core & Back',
        items: [
          'Dead bug: lower back stays flat on the floor for all 8 reps each side',
          'Bird-dog: hips stay level throughout — no rotation for all 8 reps each side',
          'Plank: 3 × 30 seconds without form breakdown',
          'Zero back pain or unusual sensation during or after any session in the last 2 weeks'
        ]
      },
      {
        label: 'Habit',
        items: [
          'Completed at least 10 out of 12 planned gym sessions in Phase 1',
          'No more than 5 consecutive days without any form of physical activity',
          'Week 3–4 interval walk: 6 rounds of 1 min fast / 2 min easy feels manageable'
        ]
      }
    ]
  }
};
</script>

<script src="../../js/workout-data.js?v=7bdb7e4b"></script>
<script src="../../js/workout-render.js?v=f4269c1f"></script>
<script>
  WorkoutRender.buildPhase(PHASE_CONFIG);
  /* Auto-activate today's day tab */
  (function () {
    var map = ['sun','mon','tue','wed','thu','fri','sat'];
    var today = map[new Date().getDay()];
    var sel   = document.querySelector('.day-selector');
    if (!sel) return;
    var wrap  = document.querySelector('.day-panels-wrap[data-panel="' + sel.dataset.panel + '"]');
    if (!wrap) return;
    var btn   = sel.querySelector('[data-day="' + today + '"]');
    var pnl   = wrap.querySelector('[data-day="' + today + '"]');
    if (!btn || !pnl) return;
    sel.querySelectorAll('.day-btn').forEach(function (b) { b.classList.remove('active'); });
    wrap.querySelectorAll('.day-panel').forEach(function (p) { p.classList.remove('active'); });
    btn.classList.add('active');
    pnl.classList.add('active');
    var btnRect = btn.getBoundingClientRect();
    var selRect = sel.getBoundingClientRect();
    sel.scrollLeft += btnRect.left - selRect.left - (selRect.width - btnRect.width) / 2;
  }());
</script>
